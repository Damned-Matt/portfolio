baseURL: "https://damned-matt.github.io/portfolio/"
title: "Matteo Pipola | Portfolio"
theme: hugo-profile

canonifyURLs: true
relativeURLs: false
# Configurazione Lingua
defaultContentLanguage: "it"
defaultContentLanguageInSubdir: false

languages:
  it:
    languageCode: "it-it"
    languageName: "Italiano"
    weight: 1
    contentDir: "content"

outputs:
  home:
    - "HTML"
    - "JSON"
  page:
    - "HTML"

enableRobotsTXT: true
pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Matteo Pipola | Portfolio"
  description: "Portfolio professionale di Matteo Pipola - System Administrator & IT Automation Specialist"
  favicon: "/portfolio/fav.png"
  brandLogo: "/portfolio/fav.png"

  useBootstrapCDN: false
  animate: true

  navbar:
    align: ms-auto
    brandName: "Matteo Pipola"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false
  # Sezione Iniziale (Hero)
  hero:
    enable: true
    intro: "Ciao, sono"
    title: "Matteo Pipola"
    subtitle: "System Administrator & IT Automation Specialist"
    content: "Costruisco e gestisco infrastrutture IT sicure ed efficienti. Specializzato nell'amministrazione di ambienti ibridi, networking e automazione avanzata dei processi tramite PowerShell e Python."
    image: "images/me.jpg"
    roundImage: true
    bottomImage:
      enable: true
    button:
      enable: false
    socialLinks:
      fontAwesomeIcons:
        - icon: "fab fa-github"
          url: "https://github.com/Damned-Matt"
        - icon: "fab fa-linkedin"
          url: "https://it.linkedin.com/in/matteopipola"

  # Sezione Chi Sono (About)
  about:
    enable: true
    title: "Chi Sono"
    image: "images/me-black.jpg"
    content: |-
      Sono un Amministratore di Sistema e di Rete focalizzato sulla sicurezza, sull'affidabilità delle infrastrutture IT e sull'efficienza operativa aziendale.

      Ho una solida esperienza nell'amministrazione di ambienti ibridi, dalla gestione di domini Active Directory all'applicazione di policy di sicurezza e conformità tramite Entra ID e Intune. Il mio punto di forza è l'automazione: sviluppo script avanzati e tool dedicati in PowerShell e Python per ottimizzare la manutenzione dei server, garantire l'integrità dei flussi di backup e abbattere drasticamente i task manuali ridondanti.
    skills:
      enable: true
      title: "Ecosistemi tecnologici e competenze core:"
      items:
        - "PowerShell Scripting & .NET GUI Tools"
        - "Python (Automation, Data Analysis, API REST)"
        - "Active Directory, Entra ID (Azure) & MDM Intune"
        - "Networking & Troubleshooting (LAN/WAN/VPN)"
        - "Windows Server & Linux Server (Debian/Ubuntu)"
        - "Virtualizzazione & Container (VMware, Docker)"
        - "ITSM, Asset Management & ERP (GLPI, Redmine, SAP)"

  # Sezione Esperienza
  experience:
    enable: true
    title: "Esperienza Professionale"
    items:
      - company: "Surgital SpA"
        companyUrl: "https://www.surgital.it/"
        jobs:
          - name: "System & Network Administrator"
            date: "Ottobre 2025 - Presente"
            content: |
              - Amministrazione e manutenzione dell'infrastruttura di rete aziendale, garantendone sicurezza e affidabilità.
              - Implementazione in totale autonomia di un'infrastruttura a container basata su Docker, curando il deployment di BookStack come Knowledge Base aziendale.
              - Configurazione da zero del sistema ITSM GLPI, strutturando la gestione dei ticket e realizzando l'inventario completo di tutti gli asset IT.
              - Sviluppo di script di automazione per il monitoraggio proattivo, l'ottimizzazione dello storage e la gestione dei sistemi core.
              - Progettazione e ottimizzazione delle policy di backup e dei piani di Disaster Recovery per ambienti fisici e containerizzati.
      - company: "Unitec SpA"
        companyUrl: "https://www.unitec-group.com/"
        jobs:
          - name: "IT Help Desk Specialist L1/L2"
            date: "Ottobre 2024 - Ottobre 2025"
            content: |
              - Supporto tecnico on-site e da remoto per utenti e filiali, assicurando la risoluzione tempestiva degli incidenti.
              - Amministrazione di Active Directory, Entra ID (ex Azure AD), licenze Microsoft 365 e gestione dispositivi tramite policy MDM Intune.
              - Automazione di task e processi IT interni tramite scripting in PowerShell e Python.
              - Gestione del ciclo dei ticket tramite GLPI e Redmine, e supporto base su interfacce ERP (SAP).
      - company: "Teleco"
        companyUrl: ""
        jobs:
          - name: "Tecnico Informatico"
            date: "Marzo 2024 - Giugno 2024"
            content: |
              - Sviluppo, manutenzione e bug-fixing del portale web aziendale in ambiente ASP.
              - Supporto Help Desk di primo livello, inclusa l'installazione e configurazione (hardware e software) delle workstation aziendali.
  education:
    enable: true
    title: "Istruzione e Formazione"
    items:
      - title: "Perito Informatico"
        school:
          name: "ITI Copernico Carpeggiani (Ferrara)"
          url: "#"
        date: "Settembre 2017 - Giugno 2022"
        content: "Diploma di istruzione secondaria superiore ad indirizzo tecnico-informatico."

  # Sezione Progetti
  projects:
    enable: true
    title: "Progetti & Automazioni"
    items:
  # Sezione Contatti
  contact:
    enable: false
    content: "La mia casella di posta è sempre aperta. Se vuoi scambiare due chiacchiere su architetture di rete, gestione server, cybersecurity o scripting sistemistico, fai un fischio!"
    btnName: Scrivimi un'e-mail
    btnLink: "mailto:example@gmail.com"

  footer:
    recentPosts:
      path: "blogs"
      count: 0
      title: "Recent Posts"
      enable: false
    socialNetworks:
      github: "https://github.com/Damned-Matt"
      linkedin: "https://it.linkedin.com/in/matteopipola"